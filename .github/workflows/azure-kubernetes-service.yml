name: Build and deploy an app to AKS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: 'acseshop3748115937'
  CONTAINER_NAME: 'productservice'
  RESOURCE_GROUP: 'rg-eshop'
  CLUSTER_NAME: 'aks-eshop'
  DEPLOYMENT_MANIFEST_PATH: './product.yml'
  DOCKER_PATH: './DockerfileProducts.acr'

jobs:
  buildImage:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'

      - name: Build and push image to ACR (use Docker instead of ACR Tasks)
        run: |
          set -e

          # Ensure az CLI is logged in (azure/login step already executed)
          az account show --output none

          # Login Docker to ACR using the Azure CLI (avoids ACR Tasks)
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

          # Build the image with Docker
          docker build -f "${{ env.DOCKER_PATH }}" -t "${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}" .

          # Push the image to ACR
          docker push "${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}"

      # (rest of your steps follow unchanged)
